name: interviewmaster

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interviewmaster}
      POSTGRES_USER: ${POSTGRES_USER:-interviewmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interviewmaster_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-interviewmaster}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-interviewmaster_dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  tika:
    image: apache/tika:3.2.3.0-full
    ports:
      - "${TIKA_PORT:-9998}:9998"

  asr:
    profiles: ["beta"]
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      ASR_MODEL: ${ASR_MODEL:-base}
      ASR_ENGINE: openai_whisper
    ports:
      - "${ASR_PORT:-9002}:9000"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    environment:
      IM_ENV: development
      IM_API_PORT: "8080"
      IM_DATABASE_URL: postgres://${POSTGRES_USER:-interviewmaster}:${POSTGRES_PASSWORD:-interviewmaster_dev}@postgres:5432/${POSTGRES_DB:-interviewmaster}?sslmode=disable
      IM_REDIS_ADDR: redis:6379
      IM_S3_ENDPOINT: http://minio:9000
      IM_S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      IM_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-interviewmaster}
      IM_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-interviewmaster_dev}
      IM_TIKA_URL: http://tika:9998
      IM_ASR_URL: http://asr:9000
      IM_AI_ENABLED: ${IM_AI_ENABLED:-false}
      IM_AI_PROVIDER: ${IM_AI_PROVIDER:-openai-compatible}
      IM_AI_BASE_URL: ${IM_AI_BASE_URL:-https://api.openai.com/v1}
      IM_AI_API_KEY: ${IM_AI_API_KEY:-}
      IM_AI_CHAT_MODEL: ${IM_AI_CHAT_MODEL:-gpt-4.1-mini}
      IM_AI_SMALL_MODEL: ${IM_AI_SMALL_MODEL:-}
      IM_AI_EMBEDDING_MODEL: ${IM_AI_EMBEDDING_MODEL:-}
      IM_AI_REQUEST_TIMEOUT: ${IM_AI_REQUEST_TIMEOUT:-30s}
      IM_AI_MAX_OUTPUT_TOKENS: ${IM_AI_MAX_OUTPUT_TOKENS:-4096}
      IM_AI_STRUCTURED_OUTPUTS: ${IM_AI_STRUCTURED_OUTPUTS:-true}
      IM_AI_MAX_INPUT_RUNES: ${IM_AI_MAX_INPUT_RUNES:-50000}
      IM_AI_MAX_INFLIGHT: ${IM_AI_MAX_INFLIGHT:-2}
      IM_AI_DAILY_CALLS_SOFT: ${IM_AI_DAILY_CALLS_SOFT:-30}
      IM_AI_DAILY_CALLS_HARD: ${IM_AI_DAILY_CALLS_HARD:-50}
      IM_JWT_SIGNING_KEY: ${IM_JWT_SIGNING_KEY:-local-development-secret-change-me}
    ports:
      - "${IM_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    environment:
      IM_ENV: development
      IM_DATABASE_URL: postgres://${POSTGRES_USER:-interviewmaster}:${POSTGRES_PASSWORD:-interviewmaster_dev}@postgres:5432/${POSTGRES_DB:-interviewmaster}?sslmode=disable
      IM_REDIS_ADDR: redis:6379
      IM_S3_ENDPOINT: http://minio:9000
      IM_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-interviewmaster}
      IM_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-interviewmaster_dev}
      IM_TIKA_URL: http://tika:9998
      IM_ASR_URL: http://asr:9000
      IM_AI_ENABLED: ${IM_AI_ENABLED:-false}
      IM_AI_PROVIDER: ${IM_AI_PROVIDER:-openai-compatible}
      IM_AI_BASE_URL: ${IM_AI_BASE_URL:-https://api.openai.com/v1}
      IM_AI_API_KEY: ${IM_AI_API_KEY:-}
      IM_AI_CHAT_MODEL: ${IM_AI_CHAT_MODEL:-gpt-4.1-mini}
      IM_AI_SMALL_MODEL: ${IM_AI_SMALL_MODEL:-}
      IM_AI_EMBEDDING_MODEL: ${IM_AI_EMBEDDING_MODEL:-}
      IM_AI_REQUEST_TIMEOUT: ${IM_AI_REQUEST_TIMEOUT:-30s}
      IM_AI_MAX_OUTPUT_TOKENS: ${IM_AI_MAX_OUTPUT_TOKENS:-4096}
      IM_AI_STRUCTURED_OUTPUTS: ${IM_AI_STRUCTURED_OUTPUTS:-true}
      IM_AI_MAX_INPUT_RUNES: ${IM_AI_MAX_INPUT_RUNES:-50000}
      IM_AI_MAX_INFLIGHT: ${IM_AI_MAX_INFLIGHT:-2}
      IM_AI_DAILY_CALLS_SOFT: ${IM_AI_DAILY_CALLS_SOFT:-30}
      IM_AI_DAILY_CALLS_HARD: ${IM_AI_DAILY_CALLS_HARD:-50}
      IM_JWT_SIGNING_KEY: ${IM_JWT_SIGNING_KEY:-local-development-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_INTERNAL_BASE_URL: http://api:8080
    ports:
      - "${IM_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
