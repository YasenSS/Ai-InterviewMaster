basePath: /
consumes:
- application/json
info:
  title: InterviewMaster API
  version: v1
paths:
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      operationId: workspaceChangePassword
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            current_password:
              type: string
            new_password:
              type: string
          required:
          - current_password
          - new_password
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema: {}
      schemes:
      - https
      summary: Change the authenticated user password
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      operationId: authLogin
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
          required:
          - email
          - password
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema:
            properties:
              access_token:
                type: string
              expires_in:
                type: integer
              token_type:
                type: string
              user:
                properties:
                  display_name:
                    type: string
                  email:
                    type: string
                  id:
                    type: string
                required:
                - id
                - email
                - display_name
                type: object
            type: object
      schemes:
      - https
      summary: Authenticate a user and start a refresh session
  /api/v1/auth/logout:
    post:
      operationId: authLogout
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema: {}
      schemes:
      - https
      summary: Revoke the current refresh session
  /api/v1/auth/refresh:
    post:
      operationId: authRefresh
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema:
            properties:
              access_token:
                type: string
              expires_in:
                type: integer
              token_type:
                type: string
              user:
                properties:
                  display_name:
                    type: string
                  email:
                    type: string
                  id:
                    type: string
                required:
                - id
                - email
                - display_name
                type: object
            type: object
      schemes:
      - https
      summary: Rotate the refresh session and issue a new access token
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      operationId: authRegister
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            display_name:
              type: string
            email:
              type: string
            password:
              type: string
          required:
          - email
          - password
          - display_name
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema:
            properties:
              access_token:
                type: string
              expires_in:
                type: integer
              token_type:
                type: string
              user:
                properties:
                  display_name:
                    type: string
                  email:
                    type: string
                  id:
                    type: string
                required:
                - id
                - email
                - display_name
                type: object
            type: object
      schemes:
      - https
      summary: Register a user and start a refresh session
  /api/v1/beta/asr/tasks:
    post:
      consumes:
      - application/json
      operationId: workspaceCreateASRTask
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            language:
              type: string
            object_key:
              type: string
          required:
          - object_key
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema:
            properties:
              status:
                type: string
              task_id:
                type: string
              transcript:
                type: string
            type: object
      schemes:
      - https
      summary: Enqueue a beta ASR task
  /api/v1/beta/asr/uploads:
    post:
      consumes:
      - application/json
      operationId: workspaceCreateASRUpload
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            content_type:
              type: string
            file_name:
              type: string
            size_bytes:
              type: integer
          required:
          - file_name
          - content_type
          - size_bytes
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema:
            properties:
              expires_at:
                type: string
              object_key:
                type: string
              upload_url:
                type: string
            type: object
      schemes:
      - https
      summary: Create a browser-direct beta ASR upload
  /api/v1/beta/company-intel/search:
    post:
      consumes:
      - application/json
      operationId: workspaceSearchCompanyIntel
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            company:
              type: string
            role:
              type: string
          required:
          - company
          - role
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema:
            properties:
              company:
                type: string
              freshness:
                type: string
              questions:
                items:
                  type: string
                type: array
              role:
                type: string
              topics:
                items:
                  type: string
                type: array
            type: object
      schemes:
      - https
      summary: Search beta company interview intelligence
  /api/v1/dashboard/summary:
    get:
      operationId: workspaceDashboardSummary
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema:
            properties:
              average_score:
                type: number
              counts:
                properties:
                  completed_interviews:
                    type: integer
                  interviews:
                    type: integer
                  resumes:
                    type: integer
                required:
                - resumes
                - interviews
                - completed_interviews
                type: object
              improvement_topics:
                items:
                  properties:
                    count:
                      type: integer
                    label:
                      type: string
                  required:
                  - label
                  - count
                  type: object
                type: array
              recent_interviews:
                items:
                  properties:
                    answered_count:
                      type: integer
                    completed_at:
                      type: string
                    created_at:
                      type: string
                    current_ordinal:
                      type: integer
                    duration_seconds:
                      type: integer
                    id:
                      type: string
                    overall_score:
                      type: integer
                    primary_language:
                      type: string
                    question_count:
                      type: integer
                    resume:
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                      required:
                      - id
                      - title
                      type: object
                    skipped_count:
                      type: integer
                    started_at:
                      type: string
                    status:
                      type: string
                    target_company:
                      type: string
                    target_role:
                      type: string
                    title:
                      type: string
                    updated_at:
                      type: string
                  required:
                  - id
                  - title
                  - status
                  - primary_language
                  - target_company
                  - target_role
                  - resume
                  - question_count
                  - answered_count
                  - skipped_count
                  - current_ordinal
                  - duration_seconds
                  - created_at
                  - updated_at
                  type: object
                type: array
              recent_resumes:
                items:
                  properties:
                    created_at:
                      type: string
                    file_name:
                      type: string
                    id:
                      type: string
                    status:
                      type: string
                    title:
                      type: string
                    updated_at:
                      type: string
                    version_id:
                      type: string
                  required:
                  - id
                  - title
                  - status
                  - created_at
                  - updated_at
                  type: object
                type: array
              score_trend:
                items:
                  properties:
                    average_score:
                      type: number
                    date:
                      type: string
                    interview_count:
                      type: integer
                  required:
                  - date
                  - average_score
                  - interview_count
                  type: object
                type: array
            type: object
      schemes:
      - https
      summary: Return the authenticated user's dashboard aggregates
  /api/v1/health:
    get:
      operationId: systemHealth
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema:
            properties:
              service:
                type: string
              status:
                type: string
              timestamp:
                type: string
              version:
                type: string
            type: object
      schemes:
      - https
      summary: Liveness probe
  /api/v1/interviews:
    get:
      operationId: workspaceListInterviews
      parameters:
      - allowEmptyValue: true
        in: query
        items:
          type: string
        name: status
        type: array
      - default: 1
        example: 1
        in: query
        name: page
        required: true
        type: integer
      - default: 20
        example: 20
        in: query
        name: page_size
        required: true
        type: integer
      - allowEmptyValue: true
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema:
            properties:
              items:
                items:
                  properties:
                    answered_count:
                      type: integer
                    completed_at:
                      type: string
                    created_at:
                      type: string
                    current_ordinal:
                      type: integer
                    duration_seconds:
                      type: integer
                    id:
                      type: string
                    overall_score:
                      type: integer
                    primary_language:
                      type: string
                    question_count:
                      type: integer
                    resume:
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                      required:
                      - id
                      - title
                      type: object
                    skipped_count:
                      type: integer
                    started_at:
                      type: string
                    status:
                      type: string
                    target_company:
                      type: string
                    target_role:
                      type: string
                    title:
                      type: string
                    updated_at:
                      type: string
                  required:
                  - id
                  - title
                  - status
                  - primary_language
                  - target_company
                  - target_role
                  - resume
                  - question_count
                  - answered_count
                  - skipped_count
                  - current_ordinal
                  - duration_seconds
                  - created_at
                  - updated_at
                  type: object
                type: array
              page:
                type: integer
              page_size:
                type: integer
              total:
                type: integer
            type: object
      schemes:
      - https
      summary: List interviews with aggregate progress
    post:
      consumes:
      - application/json
      operationId: workspaceCreateInterview
      parameters:
      - in: body
        name: body
        required: true
        schema:
          properties:
            primary_language:
              type: string
            question_duration_seconds:
              type: integer
            resume_id:
              type: string
            target_company:
              type: string
          required:
          - resume_id
          - primary_language
          - target_company
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: ""
          schema:
            properties:
              answered_count:
                type: integer
              completed_at:
                type: string
              created_at:
                type: string
              current_ordinal:
                type: integer
              duration_seconds:
                type: integer
              id:
                type: string
              overall_score:
                type: integer
              primary_language:
                type: string
              question_count:
                type: integer
              question_duration_seconds:
                type: integer
              resume:
                properties:
                  id:
                    type: string
                  title:
                    type: string
                required:
                - id
                - title
                type: object
              skipped_count:
                type: integer
              started_at:
                type: string
              status:
                type: string
              target_company:
                type: string
              target_role:
                type: string
              task_id:
                type: string
              title:
                type: string
              turns:
                items:
                  properties:
                    answer:
                      type: string
                    answered_at:
                      type: string
                    capability_key:
                      type: string
                    ordinal:
                      type: integer
                    parent_turn_id:
                      type: string
                    question:
                      type: string
                    skipped_at:
                      type: string
                    started_at:
                      type: string
                    state:
                      type: string
                    time_spent_seconds:
                      type: integer
                    turn_kind:
                      type: string
                  required:
                  - ordinal
                  - question
                  - state
                  - time_spent_seconds
                  type: object
                type: array
              updated_at:
                type: string
            type: object
      schemes:
      - https
      summary: Prepare an interview from a resume, language and target company
