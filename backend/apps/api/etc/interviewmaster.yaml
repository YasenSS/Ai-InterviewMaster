Name: interviewmaster-api
Host: 0.0.0.0
Port: 8080
# The first Eino-backed question generation path is synchronous for now. Keep the
# HTTP deadline above Runtime.AI.RequestTimeout until it moves to the worker.
Timeout: 45000
Mode: dev
Log:
  ServiceName: interviewmaster-api
  Mode: console
  Encoding: json
  Level: info
Runtime:
  Environment: development
  ServiceName: interviewmaster-api
  Database:
    URL: postgres://interviewmaster:interviewmaster_local_only@localhost:5432/interviewmaster?sslmode=disable
    MaxConnections: 20
    MinConnections: 2
    MaxConnLifetime: 30m
  Redis:
    Addr: localhost:6379
    Password: ""
    DB: 0
  ObjectStore:
    Endpoint: http://localhost:9000
    PublicEndpoint: http://localhost:9000
    Region: us-east-1
    Bucket: interviewmaster-local
    AccessKey: interviewmaster
    SecretKey: interviewmaster_local_only
    UsePathStyle: true
  Parser:
    TikaURL: http://localhost:9998
    ASRURL: http://localhost:9002
  AI:
    Enabled: false
    Provider: openai-compatible
    BaseURL: https://api.openai.com/v1
    APIKey: ""
    ChatModel: gpt-4.1-mini
    RequestTimeout: 30s
    MaxOutputTokens: 4096
    StructuredOutputs: true
  Security:
    JWTSigningKey: development-only-replace-before-production-32chars
  Telemetry:
    Enabled: false
    Endpoint: localhost:4317
    Insecure: true
  HTTP:
    AllowedOrigins:
      - http://localhost:3000
Auth:
  AccessSecret: development-only-replace-before-production-32chars
  AccessExpire: 900
  RefreshExpire: 2592000
  RefreshCookieName: interviewmaster_refresh
